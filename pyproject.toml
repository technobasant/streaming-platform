[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "streamplat"
version = "0.1.0"
description = "Tooling for streaming-platform: a seeded clickstream generator, a transactional contract gate, a freshness probe and an end-to-end reconciler."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "fastavro>=1.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "clickhouse-connect>=0.8",
    "pyiceberg[pyarrow]>=0.9",
]

[project.scripts]
streamplat = "streamplat.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamplat"]

[tool.uv]
# Supply-chain guard: never resolve a release younger than three days. It lives
# here, not only in a personal uv.toml, so the lockfile means the same thing on
# every machine and in CI.
exclude-newer = "3 days"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "fastavro.*", "pyiceberg.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "registry: needs a live Schema Registry at SCHEMA_REGISTRY_URL",
]
