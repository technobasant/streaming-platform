# streaming-platform: one container per node. `make up` builds, starts and waits.
name: sp

x-kafka: &kafka
  image: apache/kafka:4.1.0
  restart: unless-stopped
  mem_limit: 900m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 10s

x-kafka-env: &kafka-env
  CLUSTER_ID: c3BwbGF0Zm9ybS1rcmFmdA
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

x-flink-env: &flink-env
  AWS_REGION: us-east-1
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 1600m
    taskmanager.numberOfTaskSlots: 4
    cluster.evenly-spread-out-slots: true
    parallelism.default: 2
    state.backend.type: rocksdb
    state.backend.incremental: true
    state.checkpoints.dir: s3://flink/checkpoints
    state.savepoints.dir: s3://flink/savepoints
    execution.checkpointing.interval: 5s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: 1s
    execution.checkpointing.timeout: 2min
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 1s
    restart-strategy.exponential-delay.max-backoff: 10s
    heartbeat.interval: 2000
    heartbeat.timeout: 10000
    s3.endpoint: http://minio:9000
    s3.path.style.access: true
    s3.access-key: lumen
    s3.secret-key: lumen-lab-only
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
    table.local-time-zone: UTC

x-tools: &tools
  build:
    context: .
    dockerfile: docker/tools/Dockerfile
  image: sp-tools:0.1.0
  mem_limit: 768m  # the reconciler holds a run's event ids in memory
  environment: &tools-env
    KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PASSWORD: lumen
    ICEBERG_REST_URI: http://iceberg-rest:8181
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: lumen
    AWS_SECRET_ACCESS_KEY: lumen-lab-only

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092 }
  kafka-2:
    <<: *kafka
    hostname: kafka-2
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092 }
  kafka-3:
    <<: *kafka
    hostname: kafka-3
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092 }

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full_transitive
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx256m
    ports: ["127.0.0.1:18085:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    mem_limit: 384m
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lumen
      MINIO_ROOT_PASSWORD: lumen-lab-only
    ports: ["127.0.0.1:19001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set lab http://minio:9000 lumen lumen-lab-only && mc mb -p lab/flink lab/warehouse

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      # SQLite in the container's own filesystem: survives a restart, not a `make down`.
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: lumen
      AWS_SECRET_ACCESS_KEY: lumen-lab-only
      AWS_REGION: us-east-1
      JAVA_TOOL_OPTIONS: -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  init:
    <<: *tools
    command: ["bootstrap"]
    depends_on:
      schema-registry: { condition: service_healthy }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      CLICKHOUSE_PASSWORD: lumen
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./docker/clickhouse/config.d/lab.xml:/etc/clickhouse-server/config.d/lab.xml:ro
      - ./docker/clickhouse/users.d/lab.xml:/etc/clickhouse-server/users.d/lab.xml:ro
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:18123:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password lumen -q 'SELECT 1 FROM lumen.events LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  jobmanager:
    build: { context: ., dockerfile: docker/flink/Dockerfile }
    image: sp-flink:1.20.2
    restart: unless-stopped
    mem_limit: 1200m
    command: jobmanager
    depends_on:
      minio-init: { condition: service_completed_successfully }
      iceberg-rest: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    environment: *flink-env
    ports: ["127.0.0.1:18081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  taskmanager-1: &taskmanager
    image: sp-flink:1.20.2
    restart: unless-stopped
    mem_limit: 1800m
    command: taskmanager
    depends_on:
      jobmanager: { condition: service_healthy }
    environment: *flink-env
  taskmanager-2: *taskmanager

  gatekeeper:
    <<: *tools
    command: ["gatekeeper"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  exporter:
    <<: *tools
    command: ["exporter", "--interval", "5", "--threshold", "15"]
    restart: unless-stopped
    depends_on:
      clickhouse: { condition: service_healthy }

  # Not started by `up`: `make demo` and the experiments run it with their own flags.
  generator:
    <<: *tools
    profiles: ["load"]
    volumes: ["./runs:/app/runs"]
    command: ["generate", "--rate", "500", "--duration", "60"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:19090:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    mem_limit: 256m
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: lumen-lab-only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/streaming-platform.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
