global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: exporter
    static_configs: [{ targets: ["exporter:9108"] }]
  - job_name: gatekeeper
    static_configs: [{ targets: ["gatekeeper:9109"] }]
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager-1:9249", "taskmanager-2:9249"]
  - job_name: clickhouse
    static_configs: [{ targets: ["clickhouse:9363"] }]
